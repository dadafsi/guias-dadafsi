[build]
  publish = "."

# /gracias sirve gracias.html
[[redirects]]
  from = "/gracias"
  to = "/gracias.html"
  status = 200

# El código del Apps Script no se publica
[[redirects]]
  from = "/apps-script/*"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
